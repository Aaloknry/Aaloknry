name: Metrics
on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger anytime
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Profile Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Aaloknry
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          filename: github-metrics.svg
          
          # Lines of code (additions, deletions, total)
          plugin_lines: yes
          plugin_lines_history: yes
          plugin_lines_sections: base, history
          
          # Isometric Contribution Calendar (includes private contributions)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Language Breakdown
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
